<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    
    <div id="page">
        <div id="calculator">
            <div
                        id="display"
                        role="status"
                        aria-live="polite"
                    >
                        0
                    </div>

                    <button
                        class="control-button"
                        id="clear"
                        type="button"
                    >
                        AC
                    </button>

                    <button
                        class="control-button"
                        id="delete"
                        type="button"
                    >
                        DEL
                    </button>

                    <button
                        class="operator-button"
                        data-operator="/"
                        type="button"
                    >
                        ÷
                    </button>

                    <button
                        class="operator-button"
                        data-operator="*"
                        type="button"
                    >
                        ×
                    </button>

                    <button class="number-button" data-value="7" type="button">
                        7
                    </button>

                    <button class="number-button" data-value="8" type="button">
                        8
                    </button>

                    <button class="number-button" data-value="9" type="button">
                        9
                    </button>

                    <button
                        class="operator-button"
                        data-operator="-"
                        type="button"
                    >
                        −
                    </button>

                    <button class="number-button" data-value="4" type="button">
                        4
                    </button>

                    <button class="number-button" data-value="5" type="button">
                        5
                    </button>

                    <button class="number-button" data-value="6" type="button">
                        6
                    </button>

                    <button
                        class="operator-button"
                        data-operator="+"
                        type="button"
                    >
                        +
                    </button>

                    <button class="number-button" data-value="1" type="button">
                        1
                    </button>

                    <button class="number-button" data-value="2" type="button">
                        2
                    </button>

                    <button class="number-button" data-value="3" type="button">
                        3
                    </button>

                    <button class="equal-button" id="equals" type="button">
                        =
                    </button>

                    <button
                        class="number-button zero-button"
                        data-value="0"
                        type="button"
                    >
                        0
                    </button>

                    <button
                        class="number-button"
                        data-value="."
                        type="button"
                    >
                        .
                    </button>
            </div>
        
    </div>
    <script src="./script.js"></script>
</body>


</html>
